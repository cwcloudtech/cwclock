stages:
  - publish
  - build
  - deploy

mirror:
  stage: publish
  script:
    - setsid ./ci/mirror.sh
  only:
    - /^main$/
  tags:
    - mirror

build:
  stage: build
  tags:
    - imagesbuilder
  only:
    refs:
      - /^main$/
    changes: &deploy_trigger
      - ci/**/*
      - cwclock-api/**/*
      - cwclock-ui/**/*
      - .docker/**/*
      - Dockerfile
      - docker-compose*.yml
      - VERSION
  script:
    - ./ci/prune.sh
    - ./ci/deliver.sh

scan:
  stage: deploy
  needs:
    - build
  tags:
    - imagesbuilder
  only:
    refs:
      - /^main$/
    changes: *deploy_trigger
  script:
    - ././ci/prune.sh
    - ./ci/scan.sh

deploy:
  stage: deploy
  needs:
    - build
    - scan
  script:
    - ./ci/deploy.sh
    - ./ci/notif.sh
  only:
    refs:
      - /^main$/
    changes: *deploy_trigger
  tags:
    - cwclock

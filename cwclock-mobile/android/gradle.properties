org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true

android.useAndroidX=true
android.enableJetifier=false

# Classic bridge architecture (not the New Architecture / Fabric+TurboModules)
# and Hermes - the stable, broadly-compatible default for a project that
# can't be locally build-tested in this pass. Flip newArchEnabled once the
# app and its native deps have been verified against it.
newArchEnabled=false
hermesEnabled=true

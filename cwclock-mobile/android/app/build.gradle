apply plugin: "com.android.application"
// Required by react-native-gradle-plugin 0.77+'s Kotlin-based build logic,
// matching the official template (ai-instruct-115) - this app's own
// MainActivity/MainApplication stay plain Java, no .kt sources needed.
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the
 * lines you need.
 */
react {
    // Autolinking/JS bundling defaults are enough for this app, except for:
    // - autolinkLibrariesWithApp(): settings.gradle's autolinkLibrariesFromCommand()
    //   only registers each native module as a Gradle project and generates
    //   PackageList.java's source; it does NOT add those projects as :app
    //   dependencies. Without this call, PackageList.java references classes
    //   (e.g. AsyncStoragePackage) that are never on :app's compile classpath,
    //   failing compileReleaseJavaWithJavac with "package ... does not exist"
    //   for every single autolinked module (see ReactExtension.kt's doc
    //   comment on autolinkLibrariesWithApp()).
    // - hermesFlags: the default is ["-O", "-output-source-map"] (see
    //   node_modules/@react-native/gradle-plugin's ReactExtension.kt) - we keep
    //   both and add -Wno-undefined-variable, since Hermes's static scope
    //   checker otherwise warns on every reference to a legitimate global
    //   (fetch, setTimeout, XMLHttpRequest, self, navigator, ...) across the
    //   whole bundle on every release build.
    autolinkLibrariesWithApp()
    hermesFlags = ["-O", "-output-source-map", "-Wno-undefined-variable"]
}

// Release builds are unminified for now (enableProguardInReleaseBuilds =
// false) - flip this on once the release build has actually been exercised,
// since minification/shrinking can silently break reflection-based native
// module registration if the proguard rules aren't complete.
def enableProguardInReleaseBuilds = false

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.cwclock.mobile"

    defaultConfig {
        applicationId "com.cwclock.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionName is overwritten at Docker build time from the repo's
        // VERSION file (see the Dockerfile's mobile-build stage) so it
        // matches cwclock-ui/cwclock-api/cwclock-cli's shared version.
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        release {
            if (System.getenv("MOBILE_KEYSTORE_PATH")) {
                storeFile file(System.getenv("MOBILE_KEYSTORE_PATH"))
                storePassword System.getenv("MOBILE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MOBILE_KEY_ALIAS")
                keyPassword System.getenv("MOBILE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Falls back to AGP's implicit auto-generated debug keystore
            // (signingConfigs.debug) whenever MOBILE_KEYSTORE_* isn't set,
            // so `assembleRelease` always produces an installable APK.
            // Provide real release-signing secrets (CI env vars) before
            // publishing to a store.
            signingConfig System.getenv("MOBILE_KEYSTORE_PATH") ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 34
        // r27 (up from r26.1) - required for 16 KB memory page size support.
        // Devices shipping with a 16 KB page size (e.g. recent Pixel
        // hardware) fail to load native libraries built for the old 4 KB
        // page alignment, crashing the app on launch ("keeps stopping",
        // ai-instruct-115). RN itself only became 16 KB-page-compliant
        // starting at 0.77 (see the react-native version bump in
        // package.json), so bumping just the NDK without also bumping RN
        // wouldn't have fixed this - Meta's own prebuilt Hermes/react-android
        // binaries needed the same rebuild.
        ndkVersion = "27.1.12297006"
        // Stays on 1.9.24 (not the RN 0.77.3 template's 2.0.21) - Kotlin 2.0
        // makes the K2 compiler frontend the default, and K2 fails to infer
        // the self-referencing generic delegate pattern RN codegen produces
        // (e.g. RNCSafeAreaProviderManagerDelegate(this) in
        // react-native-safe-area-context, and the equivalent in
        // react-native-screens) with "Cannot infer type for this parameter" /
        // "Argument type mismatch ... but 'U!' was expected" (ai-instruct-116
        // CI failure). Confirmed by diffing SafeAreaProviderManager.kt across
        // safe-area-context 4.14.0 through the latest 5.8.0 - the source is
        // byte-for-byte identical, so no library version fixes this; it's a
        // K1-vs-K2 compiler behavior difference, not a library bug. K1 (the
        // only frontend Kotlin 1.9.x has) compiles it fine.
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // No explicit version (unlike pre-0.77, see ai-instruct-108's
        // "Could not find com.android.tools.build:gradle:." failure this
        // used to need a pin for) - react-native-gradle-plugin 0.77+ resolves
        // a compatible Android Gradle Plugin version itself via its
        // "com.facebook.react.rootproject" plugin applied below, matching
        // the official RN 0.77.3 template.
        classpath("com.android.tools.build:gradle")
        // No version here - it's not a normal Maven artifact, it resolves
        // to the local ../node_modules/@react-native/gradle-plugin project
        // via the plain includeBuild() in settings.gradle (same reasoning
        // as the AGP comment above, opposite conclusion: this one *is*
        // substituted, so a version would just be ignored/wrong).
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
    }
}

apply plugin: "com.facebook.react.rootproject"

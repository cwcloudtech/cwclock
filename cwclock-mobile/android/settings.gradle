// pluginManagement {} must be the very first statement in a Gradle settings
// file - nothing (not even rootProject.name) may precede it (ai-instruct-107
// build failure: "The pluginManagement {} block must appear before any
// other statements in the script").
pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex -> ex.autolinkLibrariesFromCommand() }

rootProject.name = "CWClockMobile"
include ":app"

// A second, plain includeBuild is required alongside pluginManagement's
// above: pluginManagement.includeBuild only registers this build for
// *plugin id* resolution (the `plugins { id("com.facebook.react.settings") }`
// block above), not for ordinary dependency substitution. Without this line,
// `classpath("com.facebook.react:react-native-gradle-plugin")` in the root
// build.gradle has nothing to resolve against (ai-instruct-108 build
// failure: "Could not find com.facebook.react:react-native-gradle-plugin:.").
includeBuild("../node_modules/@react-native/gradle-plugin")

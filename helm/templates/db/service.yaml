{{- if $.Values.db.enabled -}}
---
apiVersion: v1
kind: Service
metadata:
  name: cwclock-db
  labels:
    app: cwclock-db
  {{- include "cwclock-chart.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: cwclock-db
  {{- include "cwclock-chart.selectorLabels" . | nindent 4 }}
  ports:
    - name: "tcp"
      port: {{ $.Values.db.port }}
      targetPort: 5432
{{- end -}}

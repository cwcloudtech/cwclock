---
apiVersion: batch/v1
kind: Job
metadata:
  name: cwcloud-migrate
  labels:
  {{- include "cwclock-chart.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    spec:
      containers:
      - command:
        - /bin/sh
        - -c
        - |
          /flyway/flyway -mixed=true -url="jdbc:postgresql://$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" -user="$POSTGRES_USER" -password="$POSTGRES_PASSWORD" migrate
        envFrom:
          - configMapRef:
              name: {{ include "cwclock-chart.fullname" . }}-db-env-cm
          - secretRef:
              name: {{ include "cwclock-chart.fullname" . }}-db-env-secret
        image: {{ .Values.migrate.image.repository }}:{{ .Values.migrate.image.tag }}
        imagePullPolicy: {{ .Values.migrate.image.pullPolicy }}
        name: cwcloud-migrate
        resources: {}
        volumeMounts:
          - mountPath: /flyway/sql
            name: migration-cm
      initContainers:
        - command:
          - sh
          - -c
          - |
            while ! nc -zv -w 5 cwclock-db.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local 5432; do
              echo "Waiting for cwclock-db service..."
              sleep 1
            done
          image: busybox:1.28
          name: check-cwclock-db
      restartPolicy: Never
      volumes:
      - configMap:
          name: migration-cm
        name: migration-cm

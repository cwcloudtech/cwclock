{{- if $.Values.ui.ingress.enabled -}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cwclock-ui
  annotations:
    ingress.kubernetes.io/ssl-redirect: {{ $.Values.ui.ingress.ssl_redirect | quote }}
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cwclock-ui
            port:
              number: {{ $.Values.ui.port }}
{{- end -}}

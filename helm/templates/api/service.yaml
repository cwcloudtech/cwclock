---
apiVersion: v1
kind: Service
metadata:
  name: cwclock-api
  labels:
  {{- include "cwclock-chart.labels" . | nindent 4 }}
spec:
  selector:
    app: cwclock-api
  {{- include "cwclock-chart.selectorLabels" . | nindent 4 }}
  ports:
    - name: "http"
      port: {{ $.Values.api.port }}
      targetPort: 8080
